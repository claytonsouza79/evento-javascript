<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Funções e DOM - Loja</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
  li { display: flex; justify-content: space-between; padding: 6px 0; }
  li button { background: #e74c3c; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  input, button { padding: 8px; }
</style>
</head>
<body>
  <h2>Carrinho de compras</h2>

  <input id="nome" placeholder="Produto">
  <input id="preco" type="number" placeholder="Preço" style="width:80px">
  <button onclick="adicionarItem()">Adicionar</button>

  <ul id="lista"></ul>
  <h3>Total: R$ <span id="total">0,00</span></h3>

<script>
  let totalCarrinho = 0;

  // Função que CRIA elementos no DOM
  function adicionarItem() {
    const nome = document.getElementById('nome').value;
    const preco = Number(document.getElementById('preco').value);
    if (!nome || preco <= 0) return alert('Preencha nome e preço!');

    const li = document.createElement('li');
    li.textContent = `${nome} - R$ ${preco.toFixed(2)}`;

    const btn = document.createElement('button');
    btn.textContent = 'Remover';
    btn.addEventListener('click', () => removerItem(li, preco));

    li.appendChild(btn);
    document.getElementById('lista').appendChild(li);
    atualizarTotal(preco);
  }

  // Função que REMOVE elementos do DOM
  function removerItem(elemento, preco) {
    elemento.remove();
    atualizarTotal(-preco);
  }

  // Função que ATUALIZA o texto na tela
  function atualizarTotal(valor) {
    totalCarrinho += valor;
    document.getElementById('total').textContent = totalCarrinho.toFixed(2).replace('.', ',');
  }
</script>
</body>
</html>
