<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Fetch API - CEP</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
  input { display: block; width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
  button { padding: 8px 14px; cursor: pointer; }
  #erro { color: #c0392b; }
</style>
</head>
<body>
  <h2>Endereço de entrega</h2>

  <input id="cep" placeholder="CEP (somente números)" maxlength="8">
  <button id="buscar">Buscar CEP</button>
  <p id="erro"></p>

  <input id="rua" placeholder="Rua" readonly>
  <input id="bairro" placeholder="Bairro" readonly>
  <input id="cidade" placeholder="Cidade" readonly>
  <input id="uf" placeholder="UF" readonly>

<script>
  document.getElementById('buscar').addEventListener('click', buscarCep);

  async function buscarCep() {
    const cep = document.getElementById('cep').value;
    const erro = document.getElementById('erro');
    erro.textContent = '';

    try {
      const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      const dados = await resposta.json();

      if (dados.erro) throw new Error('CEP não encontrado');

      document.getElementById('rua').value = dados.logradouro;
      document.getElementById('bairro').value = dados.bairro;
      document.getElementById('cidade').value = dados.localidade;
      document.getElementById('uf').value = dados.uf;
    } catch (e) {
      erro.textContent = 'Erro: ' + e.message;
    }
  }
</script>
</body>
</html>
